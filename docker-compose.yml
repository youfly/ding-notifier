version: '3.8'

services:
  dingtalk-forwarder:
    build: .
    ports:
      - "5000:5000"
    environment:
      # 钉钉 Webhook URL (必填)
      - DINGTALK_WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN
      # 钉钉加签密钥 (可选，如果开启了加签安全设置则必填)
      - DINGTALK_SECRET=SECxxxxxxxxxxxxxxx
      # 配置目录路径 (可选，默认 /app/config)
      - CONFIG_DIR=/app/config
      # 服务端口 (可选，默认 5000)
      - PORT=5000
      # 调试模式 (可选，默认 false)
      - DEBUG=false
    volumes:
      # 挂载 config 目录到容器，方便修改模板和变量文件
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
