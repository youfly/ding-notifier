version: '3.8'

services:
  ding-notifier:
    container_name: ding-notifier
    image:  ghcr.io/youfly/ding-notifier:main
    ports:
      - "5005:5005"
    environment:
      # 配置目录路径 (可选，默认 /app/config)
      - CONFIG_DIR=/app/config
      # 服务端口 (可选，默认 5000)
      - PORT=5005
      # Bearer 鉴权密钥（用于 /api/webhook、/api/send 接口）
      # 从同目录 .env 文件读取，在 .env 中设置 BEARER_TOKEN=你的密钥
      # 未设置时，/api/webhook、/api/send 返回 503
      - BEARER_TOKEN=${BEARER_TOKEN}
    volumes:
      # 挂载 config 目录到容器，方便修改模板和变量文件
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, os as o; u.urlopen('http://localhost:'+o.environ.get('PORT','5005')+'/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
