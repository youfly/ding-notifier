version: '3.8'

services:
  ding-notifier:
    container_name: ding-notifier
    image:  ghcr.io/youfly/ding-notifier:main
    ports:
      - "5005:5005"
    environment:
      # 配置目录路径 (可选，默认 /app/config)
      - CONFIG_DIR=/app/config
      # 服务端口 (可选，默认 5000)
      - PORT=5005
    volumes:
      # 挂载 config 目录到容器，方便修改模板和变量文件
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, os as o; u.urlopen('http://localhost:'+o.environ.get('PORT','5005')+'/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
